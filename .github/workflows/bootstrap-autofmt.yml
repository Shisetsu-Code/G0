name: Bootstrap Autofmt

on:
  push:

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style: rustfmt bootstrap')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "g0-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add '*.rs' 'src/**/*.rs' 2>/dev/null || git add src
          git commit -m "style: rustfmt bootstrap"
          git push
