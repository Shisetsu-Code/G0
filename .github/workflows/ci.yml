name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Normalize format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: |
          cargo build --lib
          cargo test --all-targets
      - name: Compile legacy bootstrap example
        run: |
          cargo run --release -- compile examples/answer.g0 -o target/answer.s
          cc -c target/answer.s -o target/answer.o
          file target/answer.o
      - name: Compile G0 backend and compare bootstrap stages
        run: |
          cargo build --release --lib
          cargo run --release -- bootstrap compiler/native-wrapper.g0p -o target/compiler-stage1.s
          cc target/compiler-stage1.s tests/support/bootstrap_driver.c target/release/libg0.a -ldl -lpthread -lm -o target/compiler-stage1
          ./target/compiler-stage1 compiler/native-wrapper.g0p > target/compiler-stage2.s
          cmp target/compiler-stage1.s target/compiler-stage2.s
          cc target/compiler-stage2.s tests/support/bootstrap_driver.c target/release/libg0.a -ldl -lpthread -lm -o target/compiler-stage2
          ./target/compiler-stage2 compiler/native-wrapper.g0p > target/compiler-stage3.s
          cmp target/compiler-stage2.s target/compiler-stage3.s
          python -c "from pathlib import Path; b=bytearray(Path('compiler/native-wrapper.g0p').read_bytes()); b[6:8]=(2).to_bytes(2,'little'); Path('target/compiler-legacy.g0p').write_bytes(b)"
          if ./target/compiler-stage2 target/compiler-legacy.g0p > target/compiler-invalid.s; then exit 1; fi
          test ! -s target/compiler-invalid.s
      - name: Compile and execute GIR pipeline example
        run: |
          cargo run --release --example gir_answer > target/gir_answer.s
          cat > target/gir_harness.c <<'EOF'
          long g0_machine_main(void);
          int main(void) {
              return g0_machine_main() == 42 ? 0 : 1;
          }
          EOF
          cc target/gir_answer.s target/gir_harness.c -o target/gir_answer
          ./target/gir_answer
      - name: Compile and execute multi-graph native call
        run: |
          cargo run --release --example native_call > target/native_call.s
          cat > target/native_call_harness.c <<'EOF'
          long g0_machine_main(void);
          int main(void) {
              return g0_machine_main() == 42 ? 0 : 1;
          }
          EOF
          cc target/native_call.s target/native_call_harness.c -o target/native_call
          ./target/native_call
      - name: Compile and execute checked Div Rem
        run: |
          cargo run --release --example native_divrem > target/native_divrem.s
          cat > target/native_divrem_harness.c <<'EOF'
          long g0_machine_main(void);
          int main(void) {
              return g0_machine_main() == 16 ? 0 : 1;
          }
          EOF
          cc target/native_divrem.s target/native_divrem_harness.c -o target/native_divrem
          ./target/native_divrem
      - name: Compile and execute checked conversion
        run: |
          cargo run --release --example native_convert > target/native_convert.s
          cat > target/native_convert_harness.c <<'EOF'
          long g0_machine_main(void);
          int main(void) {
              return g0_machine_main() == 200 ? 0 : 1;
          }
          EOF
          cc target/native_convert.s target/native_convert_harness.c -o target/native_convert
          ./target/native_convert

  native-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Execute direct G0 compiler and native bootstrap stages
        run: |
          cargo build --lib
          cargo test --test native_aggregate_cli
          cargo test --test integer128_codec
          cargo test --test bootstrap_native_phases -- --nocapture
          cargo test --test bootstrap_control

  windows-editor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Verify native Windows editor
        run: |
          cargo test --test editor --test execution --test bootstrap_compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --bin g0-editor -- --smoke-test target/editor-native.bmp target/editor-native.g0g
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run -- check target/editor-native.g0g
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
